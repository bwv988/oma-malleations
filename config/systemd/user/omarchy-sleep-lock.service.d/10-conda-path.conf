# Temporary: keep omarchy-sleep-lock.service away from conda's dbus-monitor.
#
# omarchy-system-sleep-monitor runs `dbus-monitor --system` by bare name. This
# session's systemd user manager inherits a PATH with ~/opt/miniconda3/bin ahead
# of /usr/bin (conda is prepended in ~/.bashrc for non-interactive shells too), so
# the name resolves to conda's dbus-monitor. That copy is built with its own
# prefix, so the system-bus default becomes
# ~/opt/miniconda3/var/run/dbus/system_bus_socket, which does not exist:
#
#   Failed to open connection to system bus: Failed to connect to socket
#   /home/sral/opt/miniconda3/var/run/dbus/system_bus_socket: No such file or directory
#
# The monitor therefore died before `systemd-inhibit` was ever established, so
# the unit restart-looped every 2s (22,821 times in ~12h, no start rate limit
# engaged) and lock-before-suspend silently never ran.
#
# Pinning a system-only PATH fixes it no matter what the session imports. Check
# with: systemd-inhibit --list | grep Omarchy
#
# Remove this drop-in once https://github.com/omacom/omarchy/issues/19331 is
# fixed (the monitor should call /usr/bin/dbus-monitor by absolute path).
[Service]
Environment=PATH=/usr/share/omarchy/bin:/usr/local/bin:/usr/bin:/bin
