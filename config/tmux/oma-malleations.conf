# oma-malleations: my tmux deltas over the Omarchy default.
#
# Only what differs from $OMARCHY_PATH/config/tmux/tmux.conf belongs here, so
# `omarchy refresh tmux` followed by `./install.sh` restores stock plus exactly
# these lines. install.sh makes ~/.config/tmux/tmux.conf end with
#
#   source-file ~/.config/tmux/oma-malleations.conf
#
# which is why the bindings below can be plain overrides of the stock file.

# Prefix: Ctrl+a instead of Omarchy's Ctrl+Space, and no second prefix (stock
# uses Ctrl+b, which I give up). C-a is send-prefix so Ctrl+a Ctrl+a reaches
# the inner program, the same escape hatch Omarchy has on its own prefix.
set -g prefix C-a
set -g prefix2 None
bind -N "Send prefix" C-a send-prefix

# Stock still binds send-prefix to Ctrl+Space, which can never be reached once
# C-a is the prefix; drop it so the ? keybindings popup shows one row, not two.
unbind C-Space

# Shift+arrows switch windows too, alongside the stock Alt+arrows. Root table
# (-n), so no prefix needed.
bind -N "Previous window" -n S-Left select-window -t -1
bind -N "Next window" -n S-Right select-window -t +1
